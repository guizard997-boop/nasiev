<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nasieeeev — Social Links</title>
  <meta name="description" content="Все социальные сети nasieeeev в одном месте">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-card-hover: #1c1c1c;
      --border: #2a2a2a;
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,255,255,0.04), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,255,255,0.02), transparent);
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -1px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    .avatar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    .name { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .bio { font-size: 14px; color: var(--text-muted); font-weight: 400; max-width: 280px; line-height: 1.5; }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 80px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.03), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .link-card:hover {
      background: var(--bg-card-hover);
      border-color: #3a3a3a;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }

    .link-card:hover::before { opacity: 1; }
    .link-card:active { transform: translateY(0); }

    .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1f1f1f;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s ease;
    }

    .link-card:hover .icon-wrap { background: #2a2a2a; }
    .icon-wrap svg { width: 22px; height: 22px; fill: var(--text); }

    .link-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .link-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .link-handle { font-size: 13px; color: var(--text-muted); font-weight: 400; }

    .arrow {
      width: 20px;
      height: 20px;
      opacity: 0.4;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .link-card:hover .arrow { opacity: 1; transform: translateX(3px); }

    .footer { margin-top: 12px; font-size: 12px; color: #555; text-align: center; }

    .loading {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 20px;
    }

    @media (max-width: 480px) {
      body { padding: 32px 16px 48px; }
      .avatar { width: 84px; height: 84px; font-size: 32px; }
      .name { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <div class="avatar">N</div>
      <h1 class="name">nasieeeev</h1>
      <p class="bio">Все мои соцсети в одном месте</p>
    </div>

    <div class="links" id="links">
      <div class="loading">Загрузка...</div>
    </div>

    <p class="footer">© 2026 nasieeeev</p>
  </div>

    async function loadLinks() {
      const container = document.getElementById('links');
      try {
        const res = await fetch('/api/links');
        const links = await res.json();
        if (!links.length) {
          container.innerHTML = '<div class="loading">Пока нет ссылок</div>';
          return;
        }
        container.innerHTML = links.map(link => {
          const icon = ICONS[link.icon] || ICONS.link;
          const handle = link.handle ? `<span class="link-handle">${escapeHtml(link.handle)}</span>` : '';
          return `
            <a href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer" class="link-card">
              <div class="icon-wrap">${icon}</div>
              <div class="link-info">
                <span class="link-title">${escapeHtml(link.title)}</span>
                ${handle}
              </div>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </a>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = '<div class="loading">Ошибка загрузки</div>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    loadLinks();
  </script>
